schema: relay/v1
name: "@musibe/daily-fortune"
icon: assets/icon.svg
version: 0.1.2
display_name: 오늘의 운세
description: '이름과 날짜로 그날의 운세를 뽑아 주는 도우미. 오늘의 총운과 행운의 숫자·색·아이템, 그리고 한마디 조언을 알려준다.
  같은 이름과 같은 날짜면 언제 물어도 같은 운세가 나오고, 날짜가 바뀌면 운세도 바뀐다. 가볍고 유쾌하게 보는 재미용으로, 화면 없이
  대화로만 쓴다.'
harness:
  variants:
    - name: claude-code
      source: harness/claude-code
      entry: run
      llm:
        provider: anthropic
        auth:
          kind: oauth
agents:
  - name: daily-fortune
    persona: agents/daily-fortune/AGENT.md
    dispatch:
      - diviner
    greeting: '오늘의 운세입니다. 이름과 날짜를 알려주시면 오늘의 총운과 행운의 숫자·색·아이템, 그리고 한마디 조언까지 뽑아 드립니다.
      날짜를 말하지 않으시면 오늘로 봐 드려요. 이름 없이 그냥 "오늘 운세 봐 줘" 라고 하셔도 됩니다.'
  - name: diviner
    persona: agents/diviner/AGENT.md
    scripts:
      - fortune
scripts:
  source: scripts
